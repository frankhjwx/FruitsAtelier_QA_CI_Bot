name: Discord development
run-name: FA task ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      acceptance:
        description: Maintainer synthetic acceptance without publication
        type: boolean
        default: false
      job_id:
        description: Discord interaction ID
        required: true
        type: string
      request:
        description: Small fix, feature, or follow-up request
        required: true
        type: string
      transfer_token:
        description: Expiring private sample capability
        required: true
        type: string
      branch:
        description: Shared repair branch
        default: codex-discord-bug-fix
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: discord-repair
  cancel-in-progress: false

jobs:
  edit:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      commit: ${{ steps.edit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: controller
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve source branch
        id: source
        uses: actions/github-script@v7
        env:
          TASK_BRANCH: ${{ inputs.branch }}
          FA_ACCEPTANCE: ${{ inputs.acceptance }}
          JOB_ID: ${{ inputs.job_id }}
        with:
          script: |
            const branch = process.env.TASK_BRANCH;
            if (branch !== 'codex-discord-bug-fix' || !/^\d{15,22}$/.test(process.env.JOB_ID)) {
              throw new Error('Invalid Discord task identity');
            }
            let ref;
            try {
              ref = await github.rest.git.getRef({owner: 'frankhjwx', repo: 'FruitsAtelier', ref: `heads/${branch}`});
            } catch (error) {
              if (error.status !== 404) throw error;
              ref = await github.rest.git.getRef({owner: 'frankhjwx', repo: 'FruitsAtelier', ref: 'heads/dev'});
            }
            core.setOutput('commit', ref.data.object.sha);
      - uses: actions/checkout@v4
        with:
          repository: frankhjwx/FruitsAtelier
          ref: ${{ steps.source.outputs.commit }}
          persist-credentials: false
          path: source
      - name: Install trusted controller dependencies
        run: python -m pip install -r controller/requirements.txt
      - name: Generate and validate bounded source edits
        id: edit
        timeout-minutes: 70
        env:
          TRANSFER_URL: ${{ vars.FA_TRANSFER_URL }}
          TRANSFER_FINGERPRINT: ${{ vars.FA_TRANSFER_FINGERPRINT }}
          TRANSFER_TOKEN: ${{ inputs.transfer_token }}
          BOT_REPO: ${{ github.repository }}
          BOT_ACTIONS_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.FA_OPENAI_CI_KEY }}
          GH_TOKEN: ${{ secrets.FA_SOURCE_TOKEN }}
          FA_ACCEPTANCE: ${{ inputs.acceptance }}
          JOB_ID: ${{ inputs.job_id }}
          TASK_BRANCH: ${{ inputs.branch }}
          TASK_REQUEST: ${{ inputs.request }}
          SOURCE_ROOT: ${{ github.workspace }}/source
        run: python controller/repair_ci.py

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.acceptance }}
        with:
          name: source-${{ inputs.job_id }}
          path: source.json
          retention-days: 30
          overwrite: true
          if-no-files-found: error

      - name: Dispatch and wait for public editor package
        if: ${{ !inputs.acceptance }}
        env:
          GH_TOKEN: ${{ secrets.FA_SOURCE_TOKEN }}
          FA_ACCEPTANCE: ${{ inputs.acceptance }}
          JOB_ID: ${{ inputs.job_id }}
          SOURCE_SHA: ${{ steps.edit.outputs.commit }}
          TASK_BRANCH: ${{ inputs.branch }}
        run: python controller/preview.py

      - name: Remove private editing copies
        if: always()
        env:
          FA_ACCEPTANCE: ${{ inputs.acceptance }}
          JOB_ID: ${{ inputs.job_id }}
        run: python -c "import os,pathlib,re,shutil; k=os.environ['JOB_ID']; assert re.fullmatch(r'\d{15,22}',k); shutil.rmtree(pathlib.Path(os.environ['RUNNER_TEMP'])/('fa-samples-'+k),ignore_errors=True)"
