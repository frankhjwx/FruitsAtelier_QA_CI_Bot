name: Discord development
run-name: FA task ${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Discord interaction ID
        required: true
        type: string
      request:
        description: Small fix, feature, or follow-up request
        required: true
        type: string
      branch:
        description: Shared repair branch
        default: codex-discord-bug-fix
        required: true
        type: string

permissions:
  contents: read
concurrency:
  group: discord-repair
  cancel-in-progress: false

jobs:
  edit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      commit: ${{ steps.edit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: controller
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Resolve source branch
        id: source
        uses: actions/github-script@v7
        env:
          TASK_BRANCH: ${{ inputs.branch }}
          JOB_ID: ${{ inputs.job_id }}
        with:
          script: |
            const branch = process.env.TASK_BRANCH;
            if (branch !== 'codex-discord-bug-fix' || !/^\d{15,22}$/.test(process.env.JOB_ID)) {
              throw new Error('Invalid Discord task identity');
            }
            let ref;
            try {
              ref = await github.rest.git.getRef({owner: 'frankhjwx', repo: 'FruitsAtelier', ref: `heads/${branch}`});
            } catch (error) {
              if (error.status !== 404) throw error;
              ref = await github.rest.git.getRef({owner: 'frankhjwx', repo: 'FruitsAtelier', ref: 'heads/dev'});
            }
            core.setOutput('commit', ref.data.object.sha);
      - uses: actions/checkout@v4
        with:
          repository: frankhjwx/FruitsAtelier
          ref: ${{ steps.source.outputs.commit }}
          persist-credentials: false
          path: source
      - name: Generate bounded source edits
        id: edit
        timeout-minutes: 12
        env:
          OPENAI_API_KEY: ${{ secrets.FA_OPENAI_CI_KEY }}
          GH_TOKEN: ${{ secrets.FA_SOURCE_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          TASK_BRANCH: ${{ inputs.branch }}
          TASK_REQUEST: ${{ inputs.request }}
          SOURCE_ROOT: ${{ github.workspace }}/source
        run: python controller/worker.py

      - name: Dispatch and wait for public editor package
        env:
          GH_TOKEN: ${{ secrets.FA_SOURCE_TOKEN }}
          JOB_ID: ${{ inputs.job_id }}
          SOURCE_SHA: ${{ steps.edit.outputs.commit }}
          TASK_BRANCH: ${{ inputs.branch }}
        run: python controller/preview.py
